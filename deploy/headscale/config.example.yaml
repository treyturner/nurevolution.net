# Headscale 0.29.3. HAProxy terminates TLS on the public hostname.
server_url: https://headscale.treyturner.info
listen_addr: 0.0.0.0:8080
metrics_listen_addr: ''
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
# HAProxy must replace client-supplied forwarding headers with the real peer IP.
trusted_proxies:
  - 192.168.1.1/32

noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: headscale
    region_name: Home Headscale
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  # Self-hosted relay only; its hostname resolves to the pfSense WAN address.
  urls: []
  paths: []
  auto_update_enabled: false

node:
  expiry: 4320h
  ephemeral:
    inactivity_timeout: 5m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

tls_cert_path: ''
tls_key_path: ''
log:
  level: info
  format: text
policy:
  mode: file
  path: /etc/headscale/policy.json

# Initial deployment uses private IPs and preserves existing client resolvers.
dns:
  magic_dns: false
  base_domain: ''
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: '0700'
logtail:
  enabled: false
taildrop:
  enabled: false
auto_update:
  enabled: false
disable_check_updates: true
