# Merge this service into the existing services Compose project on Unraid.
# Use a dedicated subnet already routed through Unraid by pfSense.
services:
  headscale:
    # Headscale 0.29.3, pinned to the published image digest.
    image: ghcr.io/juanfont/headscale@sha256:0e7f1c6e4ce6c2a2a001103ecd3fa645a045adf30ac8a5234fe037b43000cd72
    command: serve
    user: '99:100'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /var/run/headscale:uid=99,gid=100,mode=0700,size=16m
      - /tmp:uid=99,gid=100,mode=0700,size=16m
    networks:
      headscale:
        ipv4_address: 172.26.0.2
    # Routed-mode allow rules only: no host IP/port is bound.
    ports:
      - target: 8080
        host_ip: 0.0.0.0
        protocol: tcp
      - target: 3478
        host_ip: 0.0.0.0
        protocol: udp
    volumes:
      - type: bind
        source: /mnt/cache/appdata/headscale/config
        target: /etc/headscale
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cache/appdata/headscale/data
        target: /var/lib/headscale
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, headscale, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

# Add this alongside the existing network definitions; leave services unchanged.
networks:
  headscale:
    name: headscale
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: 172.26.0.0/16
          gateway: 172.26.0.1
