name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable the declared pnpm version
        run: corepack enable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify
        run: pnpm verify
      - name: Retain the exact verified runtime and delivery bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-runtime
          path: .local/delivery/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          include-hidden-files: true
          path: |
            coverage/
            playwright-report/
            test-results/
            .local/delivery/report/
            .local/delivery/results/
          if-no-files-found: ignore
          retention-days: 14

  image-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Configure the disposable runner's containerd image store
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = '/etc/docker/daemon.json'
          const config = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {}
          config.features = { ...config.features, 'containerd-snapshotter': true }
          delete config['storage-driver']
          fs.writeFileSync('daemon.json', JSON.stringify(config))
          NODE
          sudo dockerd --validate --config-file daemon.json
          sudo install -m 644 daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
      - name: Verify image identity through save, load, push, and pull
        run: pnpm test:image-identity

  headscale-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify real deployment client enrollment, SSH, transfer, and cleanup
        run: |
          umask 0002
          python3 deploy/headscale/check-runner.py

  headscale-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Verify the pinned backup client and exercise recovery
        run: |
          backup_test="$RUNNER_TEMP/headscale-backup"
          mkdir -p "$backup_test"
          curl --fail --silent --show-error --location \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 \
            --output "$backup_test/restic.bz2"
          printf '%s  %s\n' f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c "$backup_test/restic.bz2" | sha256sum --check
          bzip2 --decompress "$backup_test/restic.bz2"
          chmod 700 "$backup_test/restic"
          python3 deploy/headscale/check-backup.py "$backup_test/restic"
      - name: Verify the restored Headscale server and identities
        run: sudo python3 deploy/headscale/check-restore.py

  publish:
    needs: [verify, image-identity, headscale-runner, headscale-backup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'treyturner/nurevolution.net'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-runtime
          path: verified
      - name: Authenticate the publisher to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish the verified images without rebuilding
        env:
          VERIFY_RUN_ID: ${{ github.run_id }}
        run: node verified/deploy.mjs publish --bundle verified --run "$VERIFY_RUN_ID"
      - name: Retain the digest-bound release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            verified/release.json
            verified/manifest.json
            verified/configuration.json
            verified/deploy.mjs
            verified/renderer.sha256
            verified/delivery-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
