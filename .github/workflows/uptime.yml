name: Production uptime

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'treyturner/nurevolution.net' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check production and notify incident changes
        env:
          GH_TOKEN: ${{ github.token }}
          UPTIME_DISCORD_WEBHOOK: ${{ secrets.UPTIME_DISCORD_WEBHOOK }}
        run: python3 deploy/uptime.py
      - name: Preserve incident state even when a check fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uptime-state
          path: .local/uptime/state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
