name: Production uptime

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'treyturner/nurevolution.net' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check production and notify incident changes
        env:
          GH_TOKEN: ${{ github.token }}
          UPTIME_DISCORD_WEBHOOK: ${{ secrets.UPTIME_DISCORD_WEBHOOK }}
        run: python3 deploy/uptime.py
      - name: Preserve incident state even when a check fails
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: uptime-state
          path: .local/uptime/state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
