name: Deploy verified release

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: Successful main Verify run containing the release bundle
        required: true
      source_commit:
        description: Full verified main commit SHA
        required: true

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: >-
      github.repository == 'treyturner/nurevolution.net' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      verify_run_id: ${{ steps.source.outputs.verify_run_id }}
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Select the published main release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deployment_source.py

  deploy:
    needs: release
    if: needs.release.outputs.ready == 'true'
    concurrency:
      group: nurevolution-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_COMMIT: ${{ needs.release.outputs.source_commit }}
      VERIFY_RUN_ID: ${{ needs.release.outputs.verify_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Recheck the release after waiting for deployment concurrency
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deployment_source.py
      - name: Validate promotion inputs and environment readiness
        if: steps.source.outputs.ready == 'true'
        env:
          TARGET_ENVIRONMENT: production
          DEPLOYMENT_ENABLED: ${{ vars.DEPLOYMENT_ENABLED }}
          CUTOVER_ENABLED: ${{ vars.CUTOVER_ENABLED }}
          HEADSCALE_URL: ${{ vars.HEADSCALE_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERIFY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TARGET_ENVIRONMENT" == production ]]
          [[ "$DEPLOYMENT_ENABLED" == true ]]
          [[ "$CUTOVER_ENABLED" == true ]]
          [[ "$HEADSCALE_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9](:443)?$ ]]
          python3 - <<'PY'
          import ipaddress, os
          address = ipaddress.ip_address(os.environ['DEPLOY_HOST'])
          if address not in ipaddress.ip_network('100.64.0.0/10'):
              raise SystemExit('DEPLOY_HOST must be the verified Headscale IPv4 address')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.source.outputs.ready == 'true'
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.ready == 'true'
        with:
          name: release-${{ needs.release.outputs.source_commit }}
          path: release
          run-id: ${{ needs.release.outputs.verify_run_id }}
          github-token: ${{ github.token }}
      - name: Validate release hashes and source identity
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/deploy.mjs verify-release --bundle release --run "$VERIFY_RUN_ID"
      - name: Prepare the temporary enrollment credential
        if: steps.source.outputs.ready == 'true'
        env:
          HEADSCALE_AUTH_KEY: ${{ secrets.HEADSCALE_AUTH_KEY }}
        run: |
          test -n "$HEADSCALE_AUTH_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/headscale"
          printf '%s' "$HEADSCALE_AUTH_KEY" > "$RUNNER_TEMP/headscale/auth.key"
      - name: Join the private deployment network
        if: steps.source.outputs.ready == 'true'
        id: headscale
        env:
          HEADSCALE_URL: ${{ vars.HEADSCALE_URL }}
          HEADSCALE_HOSTNAME: nurevolution-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 deploy/headscale/runner.py start
      - name: Remove the consumed enrollment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/headscale/auth.key"
      - name: Promote with independently verified release tooling
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TRANSFER_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_ENVIRONMENT: production
          HEADSCALE_PROXY_COMMAND: ${{ steps.headscale.outputs.proxy_command }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$TRANSFER_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$VERIFY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$HEADSCALE_PROXY_COMMAND"
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          ssh_args=(-i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o "ProxyCommand=$HEADSCALE_PROXY_COMMAND" -o ConnectTimeout=15)
          test "$(ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'id -un')" = "$DEPLOY_USER"
          if [[ "$(ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'nurevolution-deploy --version')" != 'nurevolution-deploy 3' ]]; then
            echo 'Install the versioned tooling bootstrap and mise runtime before promoting: docs/operations/node-runtime.md' >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "nurevolution-deploy $TARGET_ENVIRONMENT $TRANSFER_ID $VERIFY_RUN_ID $RELEASE_COMMIT"
      - name: Remove temporary deployment credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ssh"
          if [[ -f deploy/headscale/runner.py ]]; then
            python3 deploy/headscale/runner.py stop
          fi
          rm -rf "$RUNNER_TEMP/headscale"
